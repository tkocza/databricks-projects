resources:
  pipelines:
    flights_pipeline:
      name: ${bundle.target}-flights-lakeflow
      catalog: ${var.catalog}
      schema: bronze
      serverless: true

      libraries:
        - file:
            path: ../src/db_flights_lakeflow/bronze/bronze.py
        - file:
            path: ../src/db_flights_lakeflow/silver/airports.py
        - file:
            path: ../src/db_flights_lakeflow/silver/airlines.py
        - file:
            path: ../src/db_flights_lakeflow/silver/flights.py
        - file:
            path: ../src/db_flights_lakeflow/gold/dim_airlines.py
        - file:
            path: ../src/db_flights_lakeflow/gold/dim_airports.py

      environment:
        dependencies:
          - ../dist/*.whl